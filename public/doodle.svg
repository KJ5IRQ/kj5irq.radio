<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    A tiled margin-doodle: the marks someone makes while thinking on a phone
    call. Used only as a whisper behind the front page (see the `texture`
    switch in the review harness). Mid grey on purpose, so the same file reads
    on cream paper and on the dark theme, where it prints as newsprint at night.
  -->
  <g fill="none" stroke="#6f6a63" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.12">
    <!-- asterisk -->
    <path d="M34 30 C 33.7 34 34.3 39 34 43" />
    <path d="M27 33.4 C 31.6 35.6 36.4 38.4 41 40.6" />
    <path d="M41 32.4 C 36.6 35.4 32 38.2 27.4 40.2" />
    <!-- open circle, drawn in one pass -->
    <path d="M84 116 C 76.8 117.6 76.6 129.4 84.4 130.2 C 92.6 131 94.4 119.6 86.6 116.4" />
    <!-- bolt -->
    <path d="M196 142 L206 141.4 L198.6 151 L208 150.4 L193.4 166.6 L197.6 154.8 L189 155.4 Z" />
    <!-- signal, three humps -->
    <path d="M120 206 C 128 199 136 213 144 206 S 160 213 168 206" />
    <!-- a box that did not close -->
    <path d="M28 178 C 36 172 44 186 52 180 C 46 176 34 176 28 178 Z" />
    <!-- antenna, two elements -->
    <path d="M150 96 L150 120 M144 100 L156 112 M156 100 L144 112" />
    <circle cx="152" cy="42" r="1.6" />
    <circle cx="60" cy="72" r="1.2" />
    <circle cx="212" cy="216" r="1.4" />
    <circle cx="112" cy="62" r="1.1" />
    <circle cx="196" cy="24" r="1.3" />
    <circle cx="24" cy="120" r="1.2" />
  </g>
</svg>
