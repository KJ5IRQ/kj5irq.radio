name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The dateline carries the conditions at the QTH, read from NWS when the site
  # is built. Without a regular rebuild that reading would sit there going stale,
  # which is worse than not showing it. Rebuilding every 30 minutes costs
  # nothing: the fetch needs no key, and the station id is a public airport
  # weather station, not anything about Josh's address.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
